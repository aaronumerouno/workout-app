<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Workout Tracker</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="today">Today</button>
      <button class="tab-btn" data-tab="schedule">Schedule</button>
      <button class="tab-btn" data-tab="progress">Progress</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>
  </header>

  <main>
    <section id="today" class="tab-panel active">
      <div id="today-content"></div>
    </section>

    <section id="schedule" class="tab-panel">
      <div id="schedule-content"></div>
    </section>

    <section id="progress" class="tab-panel">
      <div class="card">
        <h2>Bodyweight</h2>
        <form id="weight-form">
          <input type="number" step="0.1" id="weight-input" placeholder="Weight (kg)" required>
          <button type="submit">Log weight</button>
        </form>
        <canvas id="weight-chart" width="600" height="260"></canvas>
        <p id="weight-summary" class="muted"></p>
      </div>
    </section>

    <section id="history" class="tab-panel">
      <div id="history-content"></div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
